<!DOCTYPE html>
<html>
<!--
  Author: lizlooney@google.com (Liz Looney)
-->
<head>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta charset="utf-8">

    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/jquery-3.4.1.min.js" type="text/javascript"></script>
    <script src="/js/bootstrap.min.js" type="text/javascript"></script>

    <link href="/css/blocks_common.less" rel="stylesheet/less" type="text/css">
    <link href="css/blocks_common.css" rel="stylesheet" type="text/css">

    <script src="/js/less.min.js" type="text/javascript"></script>

    <script src="server" type="text/javascript"></script>

    <script src="blocks/file_manager.js" type="text/javascript"></script>
    <script src="blocks/sound_util.js" type="text/javascript"></script>

    <title>FTC - My Sounds</title>
</head>

<body onload="initialize()">
<table class="top" width="100%">
    <tr>
        <td class="blank_td" colspan="2"></td>
    </tr>
    <tr>
        <td class="buttons_td" colspan="2">
            <table width="100%">
                <tr>
                    <td>
                        <button id="uploadFilesButton" onclick="uploadFilesButtonClicked()">Upload
                            Sounds
                        </button>
                    </td>
                    <td align="right">
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="padding: 2px"></td>
                </tr>
                <tr>
                    <td>
                        <button disabled="true" id="renameFileButton"
                                onclick="renameFileButtonClicked()">Rename Selected Sound
                        </button>
                        <button disabled="true" id="copyFileButton"
                                onclick="copyFileButtonClicked()">Copy Selected Sound
                        </button>
                        <button disabled="true" id="deleteFilesButton"
                                onclick="deleteFilesButtonClicked()">Delete Selected Sounds
                        </button>
                        <button disabled="true" id="downloadFilesButton"
                                onclick="downloadFilesButtonClicked()">Download Selected Sounds
                        </button>
                        <a id="download_link"></a>
                    </td>
                    <td align="right">
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td class="blank_td" colspan="2"></td>
    </tr>
    <tr>
        <td class="my_files_td" colspan="2">My Sounds</td>
    </tr>
    <tr>
        <td class="blank_td" colspan="2"></td>
    </tr>
</table>
<div class="scrolling_table_container" id="filesTableScroll">
    <table id="filesTable" width="100%">
        <tr class="header_tr">
            <td><input id="checkbox_all" onclick="fileCheckAllChanged()" type="checkbox"></td>
            <td width="30%">
                <div class="header_td" onclick="toggleSortByName()">Sound Name<span
                        id="sortByNameIndicator">&nbsp;</span></div>
            </td>
            <td width="60%">
                <div class="header_td" onclick="toggleSortByDateModified()">Date Modified<span
                        id="sortByDateModifiedIndicator">&nbsp;</span></div>
            </td>
        </tr>
    </table>
</div>

<div class="modal_dialog" id="newNameDialog">
    <div class="modal_dialog_container">
        <div class="modal_dialog_content">
            <center>
                <h3 id="newNameDialogTitle" style="margin-top: 0px"></h3><br>
                Sound Name:
                <input id="newName" type="text"><br>
                <div class="error_message" id="newNameError" style="width: 60ch"></div>
                <br>
                <table width="100%">
                    <tr>
                        <td align="center">
                            <button onclick="cancelNewNameDialog()">Cancel</button>
                        </td>
                        <td align="center">
                            <button onclick="okNewNameDialog()">OK</button>
                        </td>
                    </tr>
                </table>
            </center>
        </div>
    </div>
</div>

<div class="modal_dialog" id="uploadFilesDialog">
    <div class="modal_dialog_container">
        <div class="modal_dialog_content">
            <center>
                <h3 style="margin-top: 0px">Upload Sounds</h3><br>
                <input accept="audio/*" id="uploadFilesFileInput" multiple type="file"><br>
                <div class="error_message" id="uploadFilesError" style="width: 60ch"></div>
                <br>
                <table width="100%">
                    <tr>
                        <td align="center">
                            <button onclick="cancelUploadFilesDialog()">Cancel</button>
                        </td>
                        <td align="center">
                            <button id="uploadFilesOk" onclick="okUploadFilesDialog()">OK</button>
                        </td>
                    </tr>
                </table>
            </center>
        </div>
    </div>
</div>

<div class="modal_dialog" id="deleteFilesDialog">
    <div class="modal_dialog_container">
        <div class="modal_dialog_content">
            <center>
                <h3 style="margin-top: 0px">Delete Selected Sounds</h3><br>
                Are you sure you want to delete these sounds?
                <table id="deleteFilesTable">
                </table>
                <table width="100%">
                    <tr>
                        <td align="center">
                            <button onclick="noDeleteFilesDialog()">No</button>
                        </td>
                        <td align="center">
                            <button onclick="yesDeleteFilesDialog()">Yes</button>
                        </td>
                    </tr>
                </table>
            </center>
        </div>
    </div>
</div>

<script type="text/javascript">
    var FILE_MANAGER_NAME = 'SOUNDS';
    var NAME_CLASH = 'There is already a sound with this name.';
    // playSound is declared in sound_utils.js
    var PLAY_FILE_FUNCTION = 'playSound';

    window.addEventListener('resize', onresize, false);
    onresize();
</script>
</body>
</html>
